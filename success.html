<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiement réussi</title>
</head>

<body style="background:#0b1220;color:white;text-align:center;padding-top:60px;font-family:Arial;">

<!-- ======================================================
MODULE 01 — LOGO
====================================================== -->

<img src="logo_jlr.png" style="width:140px;border-radius:50%;margin-bottom:20px;">

<!-- ======================================================
MODULE 02 — TITRE
====================================================== -->

<h1 style="color:#22c55e;">Paiement réussi ✅</h1>

<p id="status" style="margin-top:20px;">Activation licence...</p>

<script>

/* ======================================================
MODULE 03 — CONFIG
====================================================== */

const API = "https://licence-server-jlr-0jex.onrender.com";

/* ======================================================
MODULE 04 — EMAIL
====================================================== */

function getEmail(){
  const params = new URLSearchParams(window.location.search);
  return params.get("email");
}

/* ======================================================
MODULE 05 — ACTIVATION
====================================================== */

async function activer(){

  const email = getEmail();

  if(!email){
    document.getElementById("status").innerText =
      "❌ Email manquant";
    return;
  }

  try{

    const res = await fetch(API + "/licence/" + email);

    if(!res.ok){
      throw new Error("Licence introuvable");
    }

    const data = await res.json();

    localStorage.setItem("licence_key", data.cle);

    document.getElementById("status").innerText =
      "Licence activée ✔\n" + data.cle;

    setTimeout(()=>{
      window.location.href = "https://vpijlr-logiciel-client-meg5.onrender.com/";
    },2000);

  }catch(e){

    document.getElementById("status").innerText =
      "❌ " + e.message;

  }

}

/* ======================================================
MODULE 06 — START
====================================================== */

window.onload = activer;

</script>

</body>
</html>
